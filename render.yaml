services:
  - type: web
    name: smart-nutrition-tracker
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: PORT
        value: 3001
      - key: GEMINI_API_KEY
        sync: false
